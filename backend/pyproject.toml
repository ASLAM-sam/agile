[project]
name = "aegis-ai"
version = "1.0.0"
description = "Aegis AI — Multi-Agent AI Software Engineering Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["B008", "N818"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these files from a template. Their column definitions are one
# long call per line by construction, and they are verified by being run, not
# by being read. Reformatting them by hand would be undone by the next
# `alembic revision --autogenerate`.
"alembic/versions/*.py" = ["E501"]
# conftest sets environment variables that must be in place before the
# application package is imported, so its imports cannot come first.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pyright]
venvPath = ".."
venv = "venv"

