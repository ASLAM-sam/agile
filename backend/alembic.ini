; Alembic configuration.
;
; The database URL is deliberately absent here: it is read from the
; application settings in alembic/env.py so migrations always target the same
; database the application does, and no credential is committed to the repo.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; Timestamped, descriptive revision filenames rather than opaque hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
; Intentionally empty. A formatting hook here fails when the formatter is not
; exposed as a console-script entrypoint, which makes `alembic revision` report
; FAILED even though the migration was written correctly. Run `ruff format
; alembic/versions` separately if you want generated migrations formatted.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
