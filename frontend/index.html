<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aegis AI — a multi-agent AI software engineering platform that turns a software idea into a production-ready starter project."
    />
    <meta name="theme-color" content="#0b0e17" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a66f5'/%3E%3Cpath d='M16 6l8 4v6c0 5-3.4 8.8-8 10-4.6-1.2-8-5-8-10v-6l8-4z' fill='%23fff' opacity='.95'/%3E%3C/svg%3E"
    />
    <title>Aegis AI — Autonomous Software Engineering</title>
    <script>
      // Applied before first paint so the correct theme is painted once,
      // avoiding a flash of the wrong background.
      (function () {
        try {
          var stored = localStorage.getItem('aegis.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark || stored === null;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
